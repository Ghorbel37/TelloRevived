[project]
name = "tello-revived"
dynamic = ["version"]
description = "Fly a DJI/Ryze Tello from Windows, Linux or macOS with a gamepad or keyboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghorbel37" }]
keywords = ["tello", "drone", "gamepad", "pygame"]
dependencies = [
    "pygame-ce>=2.5",
    "av>=14",
]

[project.urls]
Repository = "https://github.com/Ghorbel37/TelloRevived"

[project.scripts]
tello-revived = "tello_revived.cli:main"

[dependency-groups]
dev = ["numpy"]  # tools/make_screenshots.py draws its fake camera image with it; uv installs this group by default
# uv sync --group build   (for tools/build.py)
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tello_revived/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tello_revived"]
