name: Build

# Pushing a tag like v1.0 builds Windows, Linux and macOS apps and makes a release.
# "Run workflow" on the Actions page builds them without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04     # older glibc, so the binary runs on more distros
          - macos-latest     # Apple silicon
          - macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy  # selftest runs without a screen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --group build

      - name: Build
        run: uv run python tools/build.py

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/TelloRevived-*.exe).FullName
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dist/pyinstaller/TelloRevived --selftest

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/pyinstaller/Tello Revived.app/Contents/MacOS/TelloRevived" --selftest'

      - uses: actions/upload-artifact@v7
        with:
          name: TelloRevived-${{ matrix.os }}
          path: dist/TelloRevived-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
