name: Build

# Pushing a tag like v1.0 builds Windows, Linux and macOS apps and makes a release.
# "Run workflow" on the Actions page builds them without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04     # older glibc, so the binary runs on more distros
          - macos-latest     # Apple silicon
          - macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy  # selftest runs without a screen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --group build

      # A minimal FFmpeg (tools/build_ffmpeg.sh) replaces the full one PyAV ships, which makes the
      # builds much smaller. It is cached per system until the version or the recipe changes.
      - name: FFmpeg version PyAV uses
        id: ffmpeg
        shell: bash
        run: echo "version=$(uv run python -c 'import av; print(av.ffmpeg_version_info)')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: build/ffmpeg-slim
          key: ffmpeg-slim-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg.outputs.version }}-${{ hashFiles('tools/build_ffmpeg.sh') }}

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm make diffutils tar xz curl

      - name: Build the minimal FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/build_ffmpeg.sh ${{ steps.ffmpeg.outputs.version }} build/ffmpeg-slim

      - name: Build the minimal FFmpeg (Linux, macOS)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq nasm
          else HOMEBREW_NO_AUTO_UPDATE=1 brew install nasm; fi
          sh tools/build_ffmpeg.sh ${{ steps.ffmpeg.outputs.version }} build/ffmpeg-slim

      - name: Build
        shell: bash
        run: uv run python tools/build.py --slim-ffmpeg build/ffmpeg-slim

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/TelloRevived-*.exe).FullName
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dist/TelloRevived-*-linux-*-portable --selftest

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/pyinstaller/Tello Revived.app/Contents/MacOS/TelloRevived" --selftest'

      - name: Release file
        id: file
        shell: bash
        run: echo "name=$(cd dist && ls TelloRevived-v*)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.file.outputs.name }}
          path: dist/${{ steps.file.outputs.name }}
          archive: false  # the file itself, not a zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
